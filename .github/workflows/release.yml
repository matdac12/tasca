name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # Fail before the long checks if the tag and the crate version disagree.
      - name: Tag matches Cargo.toml
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tag = $env:TAG -replace '^v', ''
          if ($tag -ne $version) {
              throw "Tag $env:TAG does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: cargo build --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target\release\tasca.exe stage\
          Copy-Item scripts\install.ps1 stage\
          Copy-Item LICENSE stage\
          Copy-Item README.md stage\
          $zip = "tasca-$version-windows-x64.zip"
          Compress-Archive -Path stage\* -DestinationPath $zip
          Get-FileHash -Algorithm SHA256 target\release\tasca.exe, $zip |
              ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } |
              Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/tasca.exe
            tasca-${{ steps.version.outputs.version }}-windows-x64.zip
            SHA256SUMS.txt
