<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Tasca icon, small size: the Shelf at the edge with a wider strip and two thicker rows</title>
  <!-- Used only at 16 and 20 px, where the full drawing blurs: the dark strip is
       wider (46 vs 32), there are two rows instead of three and they are thicker
       (34 vs 18), and the gloss and hairline are dropped. -->
  <defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF6EC"/><stop offset="1" stop-color="#E9E0CE"/></linearGradient><linearGradient id="rust" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#C06B44"/><stop offset="1" stop-color="#9A4A2B"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4036"/><stop offset="1" stop-color="#2B2520"/></linearGradient><clipPath id="c"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath></defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <g clip-path="url(#c)"><rect x="8" y="0" width="46" height="256" fill="url(#dark)"/></g>
  <path d="M54 50H196a18 18 0 0 1 18 18V188a18 18 0 0 1-18 18H54Z" fill="url(#rust)"/>
  <rect x="78" y="82" width="110" height="34" rx="17" fill="#FAF6EC"/>
  <rect x="78" y="140" width="72" height="34" rx="17" fill="#FAF6EC" opacity=".85"/>
</svg>
